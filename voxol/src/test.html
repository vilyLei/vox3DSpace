    <script type="module">
        import { SimpleRenderer } from './JSCode/SimpleRenderer.js';
        
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext("webgl2");


        let renderer = new SimpleRenderer();
        renderer.initialize(gl);

        const vertSource = `#version 300 es
precision highp float;

layout(location = 0) in vec2 a_pos;

uniform mat3 u_matrix;

void main() {
    vec3 pos = u_matrix * vec3(a_pos, 1.0);
    gl_Position = vec4(pos.xy, 0.0, 1.0);
}
`;

        const fragSource = `#version 300 es
precision mediump float;
uniform vec4 u_color;
out vec4 outColor;
void main() {
    //outColor = vec4(1.0, 0.8, 0.8, 1.0);
    outColor = u_color;
}
`;

        const vertTexSource = `#version 300 es
precision highp float;

layout(location = 0) in vec2 a_pos;
layout(location = 1) in vec2 a_uv;

uniform mat3 u_matrix;
out vec2 v_uv;
void main() {
    v_uv = a_uv;
    vec3 pos = u_matrix * vec3(a_pos, 1.0);
    gl_Position = vec4(pos.xy, 0.0, 1.0);
}
`;

        const fragTexSource = `#version 300 es
precision mediump float;
uniform vec4 u_color;
in vec2 v_uv;
uniform sampler2D u_tex;
out vec4 fragColor;
void main() {
    fragColor = texture(u_tex, v_uv) * 0.5 + vec4(v_uv, 1.0, 1.0) * u_color * 0.5;
}
`;
/*

            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {

            return shader;

        function createProgram(gl, vs, fs) {
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program));
                return null;
            }
            return program;
        }


        function createShaderProgram(gl, vsSource, fsSource) {

            const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
            const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
            const program = createProgram(gl, vs, fs);

            return program;
        }
        //*/
        function getVerts() {
            let x = 0, y = 0, w = 1, h = 1;
            let verts = new Float32Array([
                x, y,
                x + w, y,
                x, y + h,
                x + w, y + h]
            );
            return verts;
        }

        function getVertsWithUV() {
            let x = 0, y = 0, w = 1, h = 1;
            let verts = new Float32Array([
                x, y, 0, 0,
                x + w, y, 1, 0,
                x, y + h, 0, 1,
                x + w, y + h, 1, 1
            ]
            );
            return verts;
        }

        function createVAO(gl, program, verts) {

            //vertexAttribIPointer(index, size, type, stride, offset)

            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);

            const vbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

            const posLoc = gl.getAttribLocation(program, "a_pos");
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 8, 0);

            return { program: program, vao: vao, locs: [posLoc] };
        }

        function createTexVAO(gl, program, verts) {

            //vertexAttribIPointer(index, size, type, stride, offset)

            const vao = gl.createVertexArray();
            gl.bindVertexArray(vao);

            const vbo = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
            gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

            const posLoc = gl.getAttribLocation(program, "a_pos");
            const uvLoc = gl.getAttribLocation(program, "a_uv");
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 16, 0);
            gl.enableVertexAttribArray(uvLoc);
            gl.vertexAttribPointer(uvLoc, 2, gl.FLOAT, false, 16, 8);

            return { program: program, vao: vao, locs: [posLoc, uvLoc] };
        }

        function createTextureFromImage(gl, image) {
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);

            gl.texImage2D(
                gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA,
                gl.UNSIGNED_BYTE, image
            );

            // 设置贴图参数
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.generateMipmap(gl.TEXTURE_2D);

            return tex;
        }

        function loadImageAndCreateTexture(gl, url, callback) {
            const img = new Image();
            img.onload = () => {
                const tex = createTextureFromImage(gl, img);
                callback(tex);
            };
            img.src = url;
        }

        function glRenderBegin(gl, vw, vh) {
            gl.clearColor(0.95, 0.95, 0.95, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.viewport(0, 0, vw, vh);
        }


        var prog_0 = null;
        var vao_0 = null;

        var prog_tex = null;
        var vao_tex = null;

        var textures = [];

        function initRender(gl) {
            var program = renderer.createShaderProgram(gl, vertSource, fragSource);
            let matrixLoc = gl.getUniformLocation(program, "u_matrix");
            let colorLoc = gl.getUniformLocation(program, "u_color");
            prog_0 = { program: program, matrixLoc: matrixLoc, colorLoc: colorLoc };
            vao_0 = createVAO(gl, program, getVerts());


            program = renderer.createShaderProgram(gl, vertTexSource, fragTexSource);
            matrixLoc = gl.getUniformLocation(program, "u_matrix");
            colorLoc = gl.getUniformLocation(program, "u_color");
            let texLoc = gl.getUniformLocation(program, "u_tex");
            prog_tex = { program: program, matrixLoc: matrixLoc, colorLoc: colorLoc, texLoc: texLoc };
            vao_tex = createTexVAO(gl, program, getVertsWithUV());
        }

        let rcmsTotal = 0;

        function render(gl, vw, vh, dataF32) {

            if (rcmsTotal < 1) {
                return;
            }
            glRenderBegin(gl, vw, vh);

            // console.log("vw, vh: ", vw, vh);
            // console.log("vao_0.program: ", vao_0.program);
            // console.log("vao_0.vao: ", vao_0.vao);
            gl.useProgram(prog_0.program);
            gl.bindVertexArray(vao_0.vao);

            let matvs = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
            matvs = dataF32.subarray(0, 9);

            // let f32Str = "";
            // for (let i = 0; i < matvs.length; i++) {
            //     f32Str += (i > 0 ? "," : "") + matvs[i];
            // }
            // console.log("matvs.length: ", matvs.length);
            // console.log("f32Str: ", f32Str);

            let color = new Float32Array([0.0, 0.6, 0.0, 1.0]);
            gl.uniform4fv(prog_0.colorLoc, color);
            gl.uniformMatrix3fv(prog_0.matrixLoc, false, matvs, 0, 9);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // matvs = dataF32.subarray(9, 18);
            // color = new Float32Array([0.0, 0.6, 0.6, 1.0]);
            // gl.uniform4fv(prog_0.colorLoc, color);
            // gl.uniformMatrix3fv(prog_0.matrixLoc, false, matvs, 0, 9);
            // gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            if (textures.length > 0) {
                let tex = textures[0];
                // console.log("xxxxxxxxx tex: ", tex);
                gl.useProgram(prog_tex.program);
                gl.bindVertexArray(vao_tex.vao);

                matvs = dataF32.subarray(9, 18);
                gl.uniformMatrix3fv(prog_tex.matrixLoc, false, matvs, 0, 9);

                color = new Float32Array([0.6, 0.0, 0.6, 1.0]);
                gl.uniform4fv(prog_tex.colorLoc, color);
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, tex);
                gl.uniform1i(prog_tex.texLoc, 0);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }

            gl.useProgram(prog_0.program);
            gl.bindVertexArray(vao_0.vao);
            color = new Float32Array([0.0, 0.6, 0.6, 1.0]);
            gl.uniform4fv(prog_0.colorLoc, color);

            for (let i = 2; i < rcmsTotal; ++i) {
                matvs = dataF32.subarray(i * 9, (i + 1) * 9);
                gl.uniformMatrix3fv(prog_0.matrixLoc, false, matvs, 0, 9);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            }

        }

        // import VoxModule from './build/voxModule.js';

        function normlizeViewSize() {

            let pw = window.innerWidth;
            let ph = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            pw = Math.round(pw * dpr);
            ph = Math.round(ph * dpr);
            return [pw, ph];
        }

        var mouseFunc = function (px, py, type, flag) {
            console.log('mouseFunc mosuePos(x=' + x + ', y=' + y + ')');
        }
        canvas.addEventListener('click', function (event) {

            // 获取鼠标点击相对于浏览器窗口的坐标
            const clientX = event.clientX;
            const clientY = event.clientY;

            // 获取canvas元素相对于浏览器窗口的位置
            const rect = canvas.getBoundingClientRect();
            const canvasX = rect.left;
            const canvasY = rect.top;

            // 计算鼠标点击在canvas内的坐标
            let x = clientX - canvasX;
            let y = clientY - canvasY;
            console.log('mouse click canvas html mousePos(' + x + ', ' + y + ')');

            const dpr = window.devicePixelRatio || 1;

            x *= dpr;
            y *= dpr;
            console.log('mouse click canvas ctx mousePos(' + x + ', ' + y + ')');
            mouseFunc(x, y, 0, 0);
        });

        async function isWasmSimdSupported() {
            const simdModule = new Uint8Array([
                0, 97, 115, 109, 1, 0, 0, 0,
                1, 5, 1, 96, 0, 1, 123,
                3, 2, 1, 0,
                10, 10, 1, 8, 0,
                65, 0,        // i32.const 0
                253, 15,      // v128.const
                253, 98,      // v128.not
                11            // end
            ]);

            try {
                return WebAssembly.validate(simdModule);
            } catch (e) {
                return false;
            }
        }

        isWasmSimdSupported().then((supported) => {
            if (supported) {
                console.log("WebAssembly SIMD 支持 !!!");
                // import('./simd.js').then(Module => Module());
            } else {
                console.warn("SIMD 不支持，加载 fallback");
                // import('./nosimd.js').then(Module => Module());
            }
        });

        function execMoculeProcess(Module) {


            const getHeapSize = Module.cwrap("get_heap_size_bytes", "number", []);
            //const startup = Module.cwrap("startup");
            const setGPUCtxSize = Module.cwrap("setGPUCtxSize", null, ["number", "number"]);
            const setMouseParams = Module.cwrap("setMouseParams", null, ["number", "number", "number", "number"]);

            let preHeapSize = 0;
            setInterval(() => {
                const size = getHeapSize();
                if (preHeapSize != size) {
                    preHeapSize = size;
                    console.log("WASM 堆内存大小:", (size / 1024 / 1024).toFixed(2), "MB");
                }
            }, 1000);


            // const getPtr = Module.cwrap("get_buffer_ptr", "number", []);
            // const setVal = Module.cwrap("set_buffer_value", null, ["number", "number"]);
            // const ptr = getPtr(); // 获取 WASM 内存中 buffer 的起始地址
            // console.log("ptr: ", ptr);
            const heap = Module.HEAPU8; // JS 端的视图
            // let u8Arr = new Uint8Array(4);
            // u8Arr = heap.subarray(ptr);
            // console.log("(typeof(heap): ", typeof (heap));
            // heap[ptr + 0] = 42;    // 写入 WASM 内存
            // heap[ptr + 1] = 255;
            // u8Arr[1] = 31;
            // setVal(10, 77);        // C++ 也可写入
            // console.log("heap[ptr + 10]: ", heap[ptr + 10]); // 77
            // console.log("heap[ptr + 1]: ", heap[ptr + 1]); // 31
            // console.log("u8Arr[1]: ", u8Arr[1]); // 31

            function resizeCanvas() {

                console.log("window.devicePixelRatio: ", window.devicePixelRatio);
                const dpr = window.devicePixelRatio || 1;

                // canvas.width = window.innerWidth * dpr;
                // canvas.height = window.innerHeight * dpr;
                // canvas.style.width = window.innerWidth + 'px';
                // canvas.style.height = window.innerHeight + 'px';
                // setGPUCtxSize(canvas.width, canvas.height);

                const [w, h] = normlizeViewSize();

                canvas.width = w;
                canvas.height = h;

                canvas.style.width = `${w / dpr}px`;
                canvas.style.height = `${h / dpr}px`;
                setGPUCtxSize(w, h);
            }

            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            resizeCanvas();
            // startup();


            const runExec = Module.cwrap("run");
            const getCmdsTotalExec = Module.cwrap("getCmdsTotal", "number");
            const getCmdsExec = Module.cwrap("getCmds", "number");
            const getRenderCmdBufferExec = Module.cwrap("getRenderCmdBuffer", "number");

            runExec();

            let cmdU8Ptr = getCmdsExec();
            let cmdBufU8Ptr = getRenderCmdBufferExec();
            let cmdU32Arr = new Uint32Array(heap.buffer);
            console.log("cmdU8Ptr: ", cmdU8Ptr);
            console.log("cmdBufU8Ptr: ", cmdBufU8Ptr);
            cmdU32Arr = cmdU32Arr.subarray(cmdU8Ptr / 4);
            console.log("cmdU32Arr[0]: ", cmdU32Arr[0], ", cmdU32Arr[1]: ", cmdU32Arr[1]);
            let cmdBufF32Arr = new Float32Array(heap.buffer);
            cmdBufF32Arr = cmdBufF32Arr.subarray(cmdBufU8Ptr / 4);

            // let f32Str = "";
            // for (let i = 0; i < 9; i++) {
            //     f32Str += (i > 0 ? "," : "") + cmdBufF32Arr[i];
            // }
            // console.log("f32Str: ", f32Str);

            let cmdsTotal = getCmdsTotalExec();
            rcmsTotal = cmdsTotal;
            console.log("cmdsTotal: ", cmdsTotal);

            //glRenderBegin(gl, canvas.width, canvas.heght);

            initRender(gl);
            render(gl, canvas.width, canvas.height, cmdBufF32Arr);

            loadImageAndCreateTexture(gl, './assets/box.jpg', (tex) => {
                console.log("loaded a img tex ...");
                textures.push(tex);
                render(gl, canvas.width, canvas.height, cmdBufF32Arr);
            });

            // mouseFunc = funsetMouseParams;
            mouseFunc = function (px, py, type, flag) {
                setMouseParams(px, py, type, flag);
                // console.log('mouseFunc mosuePos(x=' + x + ', y=' + y + ')');

                runExec();
                render(gl, canvas.width, canvas.height, cmdBufF32Arr);
            }

        };

        VoxModule().then(Module => {
            console.log("vox Module loaded.");
            execMoculeProcess(Module);
        });
    </script>
