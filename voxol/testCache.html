<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test page</title>
    <style>
        html,
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: #222;
        }
    </style>

    <script src="./build/voxolModule.js"></script>

    <script>

    </script>
</head>

<body>

    <canvas id="canvas"></canvas>

    <script type="module">

        import { SimpleCacheDrawer, printWith9Number } from './src/JSCode/SimpleCacheRenderer.js';
        import { ModuleWrapper } from './src/JSCode/WasmModule.js';
        
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext("webgl2", { antialias: true, depth: false });

        let moduleWrapper = new ModuleWrapper();
        let viewTransDesc = moduleWrapper.ins.viewTransDesc;
        let renderer = new SimpleCacheDrawer();

        function initMoculeProcess(Module) {
            moduleWrapper.initialize(Module, canvas, gl);
            renderer.initialize(moduleWrapper.ins, gl, canvas.width, canvas.height);
        };

        VoxModule().then(Module => {
            console.log("Voxol Wasm Module loaded.");
            initMoculeProcess(Module);
        });

        let drawTimes = -1;
        let countTimes = 0;

        function render() {

            if (!moduleWrapper.isEnabled())
                return;

            drawTimes++;
            if (drawTimes % 1 != 0)
                return;

            countTimes++;
            moduleWrapper.updateCtxViewParam((w, h) => {
                renderer.setCtxSize(w, h);
            });

            let flag = moduleWrapper.run();
            if (flag < 1 && !render.dirty)
                return;

            viewTransDesc.update();
            renderer.runBegin();
            let ins = moduleWrapper.ins;
            renderer.draw();
            renderer.drawBatch(ins.batchEleDesc);
            render.dirty = false;
            console.log("render() ...");
        }

        function loopRun() {
            render();
            requestAnimationFrame(loopRun);
        }
        loopRun();
    </script>
</body>

</html>
